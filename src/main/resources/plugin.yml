name: ItemAuction
version: '1.0.0'
main: com.yourserver.itemauction.ItemAuctionPlugin
api-version: '1.21'
author: YourServer
description: Item-for-item auction house (barter). Players trade items for items instead of money.

commands:
  ah:
    description: Открыть аукцион предмет-за-предмет
    usage: /ah [create|my|mail|cancel|help]
    permission: itemauction.use
    permission-message: У тебя нет прав на использование аукциона.

permissions:
  itemauction.use:
    description: Разрешает пользоваться /ah
    default: true
  itemauction.admin:
    description: Разрешает удалять чужие лоты (/ah cancel <id>)
    default: op
